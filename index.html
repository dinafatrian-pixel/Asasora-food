<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PT. ASASORA BIO HEALTHORA</title>
    <meta name="description" content="Aplikasi portal resmi Food Health Partner PT. ASASORA BIO HEALTHORA: Katalog Catering Halal, Layanan Prasmanan & Makanan Sehat, Formulir Pesanan & Cek Ongkir Otomatis, dan Invoice Pembayaran Resmi." />
    <meta property="og:title" content="PT. ASASORA BIO HEALTHORA" />
    <meta property="og:description" content="Aplikasi portal resmi Food Health Partner PT. ASASORA BIO HEALTHORA: Katalog Catering Halal, Layanan Prasmanan & Makanan Sehat, Formulir Pesanan & Cek Ongkir Otomatis, dan Invoice Pembayaran Resmi." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/logo-asasora.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">

    <!-- Non-blocking asynchronous font loading with system-ui fallback for instant FCP -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      />
    </noscript>

    <!-- Inline Critical CSS for instantaneous above-the-fold first paint (FCP < 1.2s) -->
    <style id="critical-above-the-fold-css">
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html {
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F9FDF9;
        color: #1f2937;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* Critical Header Layout */
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background-color: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(6, 78, 59, 0.1);
        height: 80px;
        width: 100%;
      }
      /* Critical Hero Section Layout */
      #home {
        position: relative;
        background: linear-gradient(135deg, rgba(240, 253, 244, 0.8) 0%, rgba(254, 252, 232, 0.3) 50%, #ffffff 100%);
        padding-top: 2.5rem;
        padding-bottom: 2.5rem;
        border-bottom: 1px solid #f0fdf4;
        contain: layout style;
      }
      @media (min-width: 640px) {
        #home {
          padding-top: 4rem;
          padding-bottom: 4rem;
        }
      }
      @media (min-width: 1024px) {
        #home {
          padding-top: 6rem;
          padding-bottom: 6rem;
        }
      }
      .critical-container {
        width: 100%;
        max-width: 80rem;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }
      /* Prevent layout shifts on Hero CTA Buttons & Halal Card */
      .hero-cta-btn {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      img[loading="lazy"] {
        content-visibility: auto;
      }
    </style>
  </head>
  <body class="bg-[#F9FDF9] text-gray-800 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
