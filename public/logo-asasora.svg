<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .brand-font-bold {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
      }
      .brand-font-medium {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Group containing emblem and fork -->
  <g transform="translate(0, -10)">
    <!-- Center Top Leaf (Bright Green / Lime) -->
    <path d="M250,55 C295,115 315,185 300,230 L200,230 C185,185 205,115 250,55 Z" fill="#7CB342"/>
    
    <!-- Left Leaf (Olive / Forest Green) -->
    <path d="M165,115 C205,155 210,240 180,290 C165,270 160,230 180,185 C175,175 168,160 165,115 Z" fill="#4B7E28" opacity="0.9"/>
    <path d="M165,115 C230,150 250,250 250,305 C185,305 160,250 165,115 Z" fill="#4A7C2C"/>

    <!-- Right Leaf (Vibrant Orange) -->
    <path d="M335,115 C270,150 250,250 250,305 C315,305 340,250 335,115 Z" fill="#F08518"/>
    <!-- Small Leaf Notch / Detail -->
    <path d="M312,192 L338,197 L322,210 Z" fill="#F9FDF9"/>

    <!-- Fork Cutout (White Silhouette) -->
    <g fill="#FFFFFF">
      <!-- 4 Fork Prongs -->
      <rect x="226" y="132" width="10" height="52" rx="4"/>
      <rect x="242" y="132" width="10" height="52" rx="4"/>
      <rect x="258" y="132" width="10" height="52" rx="4"/>
      <rect x="274" y="132" width="10" height="52" rx="4"/>
      <!-- Fork Base Bridge -->
      <path d="M224,175 C224,208 244,228 244,250 L256,250 C256,228 276,208 276,175 Z"/>
      <!-- Fork Stem / Handle -->
      <path d="M244,248 C244,270 248,290 252,305 L248,305 C242,290 240,270 244,248 Z" fill="#FFFFFF"/>
      <!-- Center Stem Line -->
      <path d="M250,245 L250,305" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Typography: ASASORA -->
  <text x="250" y="385" text-anchor="middle" fill="#2E6F40" font-size="58" letter-spacing="4" class="brand-font-bold">ASASORA</text>

  <!-- Subtitle Typography: BIO HEALTHORA -->
  <g transform="translate(250, 422)" text-anchor="middle" font-size="22" letter-spacing="3" class="brand-font-medium">
    <text x="-70" y="0" fill="#F08518">BIO</text>
    <text x="35" y="0" fill="#2E6F40">HEALTHORA</text>
  </g>
</svg>
